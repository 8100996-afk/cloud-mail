name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "cloudmail"		#d1数据库名字
database_id = "945b3dfe-965f-40dc-ba93-ae595a83c848"		#d1数据库id

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "3653d434b9c844efabbedb6203a8772e"					#kv数据库id

# 如使用附件功能(R2 对象存储)，填写你的 R2 桶名并取消下面三行的注释
#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]	#定时任务每天晚上12点执行


[vars]
#orm_log = false
domain = ["12300.asia","12300.bond","12300.cyou","12300.xyz","12888.bond","89999.bond","kkgo.xyz","mailo.cyou"]	#邮件域名(JSON数组) —— 每个域名都必须在 Cloudflare Email Routing 里把收件转发到本 worker，否则收不到信；不用于本邮箱服务的请删掉
admin = "admin@12300.asia"		#管理员邮箱
# 本仓库为公开仓库，jwt_secret 属于密钥，严禁写入此文件！请在 Cloudflare 面板
# → cloud-mail → 设置 → 变量和机密 中，将 jwt_secret 添加为 Secret(机密)
#jwt_secret = ""			#jwt令牌的密钥(仅在私有部署时才可写在此处)
#risk_control = true		#IP风控总开关,检测到代理/VPN或机房IP时阻止注册;设为false关闭
#iplark_api = "https://iplark.com/ipstack?ip={ip}"	#IP检测接口地址,使用{ip}作为占位符,需返回JSON
#risk_block_proxy = true	#是否拦截 代理/VPN,默认拦截;设为false关闭
#risk_block_hosting = true	#是否拦截 数据中心/机房 IP,默认拦截;设为false关闭
#risk_timeout = 4000		#请求IP检测接口的超时时间(毫秒),默认4000

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
